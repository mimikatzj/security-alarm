# 보안 브리핑 설정 파일
# 매일 07:00 KST 에 실행되어 "전날 00:00~24:00(KST)" 에 올라온 글을 정리해 보냅니다.
# 소스를 추가/삭제하거나 키워드를 조정하려면 이 파일만 수정하면 됩니다.

# ── 출력 섹션 ───────────────────────────────────────────────
# 카톡 메시지와 다이제스트에 이 순서대로 표시됩니다.
#   limit            : 섹션 전체 최대 건수 (0 = 전부)
#   limit_per_source : 소스별 최대 건수 (0 = 제한 없음)
#   dedupe           : 같은 사건을 다룬 다른 매체 기사 중복 제거
#   strict_limit     : true 면 우선순위 글도 상한을 넘지 않음 (우선순위 글부터 채움)
#   short            : 카톡 요약(200자)에 쓰는 짧은 이름
# ※ 기본은 우선순위 글(priority_rules)이 상한을 넘어도 전부 보여주고, 남는 자리만 일반 글로 채웁니다.
sections:
  - track: 사고
    region: 국내
    label: "[사고] 국내"
    short: 사고·국내
    limit: 5
    dedupe: true
  - track: 사고
    region: 해외
    label: "[사고] 해외"
    short: 사고·해외
    limit: 3
    strict_limit: true   # 해외는 우선순위 글이 많아도 최대 3건
    dedupe: true
  - track: 정책
    region: 국내
    label: "[정책]"
    short: 정책
    limit_per_source: 3
  - track: 가이드
    region: 국내
    label: "[가이드]"
    short: 가이드
    limit: 0            # 올라오는 건 전부

# 중복 판단 기준 (0~1). 높일수록 엄격(덜 묶음), 낮출수록 느슨(많이 묶음)
dedupe_threshold: 0.35

# ── 우선순위 규칙 (트랙별) ──────────────────────────────────
#   any  : 키워드 중 하나라도 포함되면 우선
#   all  : 각 묶음에서 하나씩 모두 포함되면 우선
#   none : 이 중 하나라도 있으면 그 규칙은 불충족 (오탐 방지)
#   level: 우선순위 등급 (기본 1). 클수록 먼저 배치 — 해외처럼 상한이 고정된 섹션에서 의미 있음
# 제목만 보고 판단하며, 제목 앞의 "기관명, " (예: "개인정보위, ")은 빼고 봅니다.
priority_rules:
  사고:
    # ① 실제 침해사고가 난 건 (최우선, 취약점 공개·패치 권고 기사는 제외)
    - level: 2
      any: [해킹, 침해, 유출, 랜섬웨어, 탈취, 디도스, DDoS, 감염, 털려, 털린, 피해,
            침투, 장악, 사이버 공격, 공격 확인, 노린 공격,
            breach, breached, hacked, data leak, leaked, stolen, compromised, extortion,
            cyberattack, cyber attack, ransomware attack, data theft]
      none: [위험, 주의, 경고, 점검, 권고, 패치, 업데이트, 취약점 공개, 대응 방안,
             warns, patch, flaw, vulnerability]
    # ② 긴급·고위험 취약점 (제로데이, 실제 악용, 긴급 패치 등)
    - level: 1
      any: [제로데이, "0-day", zero-day, 실제 악용, 악용 중, 악용 확인, 악용 경보, 원격 코드 실행, 원격 해킹,
            actively exploited, active exploitation, exploited in attacks, exploited in the wild,
            "CVSS 10", "CVSS 9"]
    - level: 1
      all:
        - [긴급, 고위험, 치명적, 심각, critical, emergency, urgent]
        - [취약점, 패치, 업데이트, 결함, 보안 업데이트, flaw, vulnerability, vulnerabilities,
           patch, bug, RCE]
  정책:   # 보안 관련 정책 변경, 과징금, 조사
    - any: [과징금, 과태료, 제재, 처분, 시정명령, 조사]
    - all:
        - [보안, 개인정보, 정보보호, 사이버, 해킹, 침해, 유출, 취약점, 랜섬웨어]
        - [개정, 시행, 제정, 도입, 의무, 강화, 규제, 지침, 가이드라인, 안내서, 고시,
           법안, 입법, 시행령, 제도, 기준, 정책, 개선]

# ── 수집 소스 (사이트 안의 지정 메뉴만) ─────────────────────
#   type             : rss | pipc_board | msit_board | fsec_board
#   link_prefix      : 링크가 이 주소로 시작하는 글만 수집 (메뉴별 RSS 가 없는 사이트용)
#   include_keywords : 지정하면 제목/요약에 하나라도 포함된 글만 수집
#   exclude_keywords : 소스별 제외 키워드 (전역 filters.exclude_keywords 에 추가됨)
sources:
  # 사고 · 국내
  - name: 보안뉴스 사건·사고
    track: 사고
    region: 국내
    type: rss
    url: https://www.boannews.com/rss/S1N2.xml
  - name: 데일리시큐 이슈
    track: 사고
    region: 국내
    type: rss
    url: https://www.dailysecu.com/rss/S1N2.xml

  # 사고 · 해외
  - name: The Hacker News
    track: 사고
    region: 해외
    type: rss
    url: https://thehackernews.com/feeds/posts/default/-/Cyber%20Attack?alt=rss
  # 분류별 RSS 가 없어 전체 피드에서 Security 메뉴(/news/security/) 기사만 남긴다
  - name: BleepingComputer
    track: 사고
    region: 해외
    type: rss
    url: https://www.bleepingcomputer.com/feed/
    link_prefix: https://www.bleepingcomputer.com/news/security/

  # 정책 · 국내 (RSS 가 없어 목록 페이지를 읽는다)
  - name: 개인정보위 보도자료
    track: 정책
    region: 국내
    type: pipc_board
    url: https://pipc.go.kr/np/cop/bbs/selectBoardList.do?bbsId=BS074&mCode=C020010000
  - name: 과기정통부 보도자료
    track: 정책
    region: 국내
    type: msit_board
    url: https://www.msit.go.kr/bbs/list.do?sCode=user&mPid=208&mId=307
    # 보안과 무관한 보도자료를 아예 빼려면 아래 주석을 해제
    # include_keywords: [보안, 해킹, 침해, 취약점, 개인정보, 사이버, 랜섬웨어, 유출, 정보보호]

  # 가이드
  - name: KISA 보호나라
    track: 가이드
    region: 국내
    type: rss   # 목록 페이지(menuNo=205021, bbsId=B0000127)와 같은 게시판의 RSS
    url: https://www.boho.or.kr/kr/rss.do?bbsId=B0000127
  - name: 개인정보위 안내서
    track: 가이드
    region: 국내
    type: pipc_board
    url: https://pipc.go.kr/np/cop/bbs/selectBoardList.do?bbsId=BS217&mCode=D010030000
  - name: 금융보안원
    track: 가이드
    region: 국내
    type: fsec_board
    url: https://www.fsec.or.kr/bbs/222

filters:
  # 제목/요약에 포함되면 제외 (대소문자 무시)
  exclude_keywords:
    - "[포토]"
    - "[인사]"
    - "[부고]"
    - "웨비나"
    - "Webinar"

# ── 같은 등급(우선/일반) 안에서의 정렬 점수 ─────────────────
scoring:
  keywords:
    긴급: 3
    제로데이: 3
    "0-day": 3
    "zero-day": 3
    "actively exploited": 3
    "under active exploitation": 3
    악용: 2
    랜섬웨어: 2
    ransomware: 2
    원격 코드 실행: 2
    "RCE": 2
    유출: 2
    "breach": 2
    과징금: 2
    해킹: 1
    침해: 1
    "hack": 1
    "CVE-": 1
    취약점: 1
    "vulnerability": 1
    보안: 1
    개인정보: 1
    사이버: 1

kakao:
  notify_when_empty: true    # 새 소식이 없어도 "새 소식 없음" 메시지 발송

state:
  retention_days: 45         # 이미 보낸 글 기록 보관 기간
