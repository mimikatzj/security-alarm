name: daily-security-brief

on:
  # GitHub 스케줄은 정각에 몰려 지연·누락이 잦음 → 정각을 피하고 예비 실행 2번
  # 예비 실행은 그날 이미 보냈으면(site/<전날>.html 존재) 바로 종료
  schedule:
    - cron: "43 21 * * *"   # 06:43 KST (본 실행)
    - cron: "23 22 * * *"   # 07:23 KST (예비)
    - cron: "13 23 * * *"   # 08:13 KST (예비)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "카톡 발송 없이 로그로만 확인"
        type: boolean
        default: false
      date:
        description: "대상 날짜 YYYY-MM-DD (비우면 어제). 누락된 날 다시 보낼 때"
        required: false
        default: ""

permissions:
  contents: write   # site/ (전체 목록 페이지) 커밋용

concurrency:
  group: daily-security-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      skip: ${{ steps.guard.outputs.skip }}
    steps:
      - uses: actions/checkout@v5

      # 스케줄 실행만: 오늘 이미 보냈으면 건너뜀 (수동 실행은 항상 진행)
      # 대기열에 밀린 실행은 예전 커밋을 받을 수 있어 원격 최신 상태로 확인
      - name: Check already sent
        id: guard
        if: github.event_name == 'schedule'
        run: |
          T=$(TZ=Asia/Seoul date -d yesterday +%F)
          git fetch -q origin "$GITHUB_REF_NAME"
          if git cat-file -e "origin/$GITHUB_REF_NAME:site/$T.html" 2>/dev/null; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "$T 브리핑은 이미 발송됨 → 건너뜀"
          fi

      - uses: actions/setup-python@v6
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
        if: steps.guard.outputs.skip != 'true'

      - name: Collect & send
        if: steps.guard.outputs.skip != 'true'
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_NEW_TOKEN_FILE: ${{ runner.temp }}/kakao_refresh_token
          TARGET_DATE: ${{ inputs.date }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ -n "$TARGET_DATE" ]; then ARGS="$ARGS --date $TARGET_DATE"; fi
          python -m alarm.main $ARGS

      # 카카오 refresh token 은 만료 1개월 전부터 갱신본이 발급됨 → Secret 자동 교체
      - name: Rotate Kakao refresh token
        if: always() && steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          TOKEN_FILE: ${{ runner.temp }}/kakao_refresh_token
        run: |
          if [ ! -s "$TOKEN_FILE" ]; then echo "갱신 불필요"; exit 0; fi
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::새 Kakao refresh token 이 발급됐지만 GH_PAT 가 없어 Secret 을 갱신하지 못했습니다."
            exit 0
          fi
          gh secret set KAKAO_REFRESH_TOKEN --repo "$GITHUB_REPOSITORY" < "$TOKEN_FILE"
          echo "KAKAO_REFRESH_TOKEN 갱신 완료"

      - name: Commit pages
        if: success() && !inputs.dry_run && steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A site
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "brief: $(TZ=Asia/Seoul date +%F)"
          git pull -q --rebase origin "$GITHUB_REF_NAME"
          git push

      # 카톡 '전체 목록 보기' 버튼이 여는 페이지 (https://<계정>.github.io/<저장소>/<날짜>.html)
      - name: Upload page
        if: success() && !inputs.dry_run && steps.guard.outputs.skip != 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  # 배포는 별도 작업 — 실패해도 'Re-run failed jobs' 로 배포만 다시 할 수 있음 (카톡 재발송 없음)
  deploy:
    needs: brief
    if: ${{ !inputs.dry_run && needs.brief.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.retry.outputs.page_url || steps.first.outputs.page_url }}
    steps:
      - name: Deploy page
        id: first
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before retry
        if: steps.first.outcome == 'failure'
        run: sleep 30

      - name: Deploy page (retry)
        id: retry
        if: steps.first.outcome == 'failure'
        uses: actions/deploy-pages@v4
